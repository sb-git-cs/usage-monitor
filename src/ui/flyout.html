<!DOCTYPE html>
<html class="fit">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="hud flyout" id="root">
    <div class="head">
      <span>Usage Monitor</span>
      <div class="chrome-actions">
        <select class="interval" id="interval" title="Auto-refresh">
          <option value="5">5s</option>
          <option value="15">15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
        <button class="icon-btn" id="dock" title="Snap to taskbar">▤</button>
        <button class="icon-btn" id="refresh" title="Refresh now">↻</button>
      </div>
    </div>
    <div id="body"></div>
  </div>
  <script src="../models.js"></script>
  <script src="format.js"></script>
  <script src="drag.js"></script>
  <script src="flyout.js"></script>
</body>
</html>
