<!DOCTYPE html>
<html class="fit" lang="en">
<head>
  <meta charset="utf-8" />
  <title>Usage Monitor</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src data:" />
  <link rel="stylesheet" href="shared.css" />
  <script src="../battery-model.js"></script>
  <script src="battery-chart.js"></script>
</head>
<body>
  <div class="hud flyout" id="root">
    <div class="head">
      <span>Usage Monitor</span>
      <div class="chrome-actions">
        <button class="pair-btn" id="insights" type="button">Insights</button>
        <select class="interval" id="interval" title="Auto-refresh" aria-label="Auto-refresh interval">
          <option value="5">5s</option>
          <option value="15">15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
        </select>
        <button class="icon-btn" id="network" title="Network usage" aria-label="Network usage">⇅</button>
        <button class="icon-btn" id="dock" title="Snap to taskbar" aria-label="Toggle taskbar snapping">▤</button>
        <button class="icon-btn" id="refresh" title="Refresh now" aria-label="Refresh now">↻</button>
        <button class="pair-btn" id="pair" type="button" title="Pair a phone">Pair</button>
        <button class="icon-btn" id="settings" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </div>
    <section class="pair-card" id="pairCard" hidden>
      <div class="pair-copy">
        <p>Scan this in the Android app, or type the code.</p>
        <div class="pair-code" id="pairCode"></div>
        <div class="pair-address" id="pairAddress"></div>
        <p class="hint" id="pairState"></p>
        <p class="hint" id="pairExpires"></p>
        <button class="link-btn" id="pairCancel" type="button">Cancel</button>
      </div>
    </section>
    <section class="overview" id="overview" aria-label="Plan overview">
      <div><span class="overview-label">Reporting</span><strong id="overviewReporting">Waiting</strong></div>
      <div><span class="overview-label">Attention</span><strong id="overviewAttention">Waiting</strong></div>
      <div><span class="overview-label">Next reset</span><strong id="overviewReset">Waiting</strong></div>
    </section>
    <div class="section-caption"><span>Plan usage <span class="caption-detail">Used / limit · time to reset</span></span><span id="overviewCoverage"></span></div>
    <div id="body"></div>
    <section class="session-card" id="sessions" hidden aria-label="Coding sessions">
      <div class="p-head">
        <span class="p-name"><span class="net-glyph" aria-hidden="true">›_</span><span>Sessions</span><span class="session-count" id="sessionCount"></span></span>
        <label class="session-auto" id="autoResumeRow"><input type="checkbox" id="autoResume" /> Resume after limit</label>
      </div>
      <div id="sessionRows"></div>
    </section>
    <section class="battery-card" id="batteryCard" hidden tabindex="-1" aria-label="Battery">
      <div class="p-head"><strong id="batteryLevel">Battery</strong><button class="link-btn" id="batteryHistory" type="button">View history ›</button></div>
      <p id="batteryStatus" role="status"></p><p class="hint" id="batteryUpdated"></p>
      <div id="batterySpark" class="battery-chart"></div>
    </section>
    <section class="net-card" id="net" hidden title="Open Network usage" role="button" tabindex="0" aria-label="Open network usage monitor">
      <div class="p-head">
        <span class="p-name"><span class="net-glyph" aria-hidden="true">⇅</span><span>Network</span></span>
        <span class="p-plan" id="netState">Open monitor ›</span>
      </div>
      <div class="net-row">
        <div class="net-stat"><span class="net-label"><span class="net-swatch rx"></span>Download</span><span class="net-value" id="netRx">—</span></div>
        <div class="net-stat"><span class="net-label"><span class="net-swatch tx"></span>Upload</span><span class="net-value" id="netTx">—</span></div>
        <div class="net-stat"><span class="net-label">Used in the last hour</span><span class="net-value small" id="netHour">—</span></div>
      </div>
      <div class="net-top" id="netTop"></div>
    </section>
    <div class="update-bar" id="update" hidden>
      <span class="update-version" id="updateVersion"></span>
      <span class="update-status" id="updateStatus"></span>
      <button class="link-btn" id="updateAction" type="button" hidden></button>
    </div>
  </div>
  <script src="../models.js"></script>
  <script src="../net/format.js"></script>
  <script src="format.js"></script>
  <script src="overview.js"></script>
  <script src="drag.js"></script>
  <script src="flyout.js"></script>
</body>
</html>
