name: Checks
on: [push, pull_request]
permissions:
  contents: read
# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: UI smoke test
        if: runner.os != 'Linux'
        run: npm run test:ui
      - name: UI smoke test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron --no-sandbox scripts/ui-smoke.js
      - name: Live capture probe
        if: runner.os != 'Windows'
        run: node scripts/probe-capture.js
      - name: Compile the network helper with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $src = [IO.File]::ReadAllText("helpers/windows/NetCapture.cs")
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly "$env:RUNNER_TEMP\UsageMonitorNetHelper.exe" -OutputType WindowsApplication -ReferencedAssemblies System.Core, Microsoft.CSharp
          Start-Process "$env:RUNNER_TEMP\UsageMonitorNetHelper.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.json" -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.json"
      - run: npm audit --audit-level=high
        if: runner.os == 'Linux'
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Packaged UI smoke test
        if: runner.os == 'Windows'
        run: npm run test:ui -- --packaged
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --dir --publish never

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Unit tests, lint and debug build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: usage-monitor-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
