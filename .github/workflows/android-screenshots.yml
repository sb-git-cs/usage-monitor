name: Android screenshots
# Renders the phone screens with demo data and commits them to docs/screenshots/android on the
# same branch, so contributors without the Android SDK still get up-to-date images.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - android/app/src/main/java/io/github/sbgitcs/usagemonitor/ui/**
      - android/app/src/test/java/io/github/sbgitcs/usagemonitor/ScreenshotsTest.kt
      - .github/workflows/android-screenshots.yml
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Render screenshots
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ScreenshotsTest*' -PscreenshotsDir=../docs/screenshots/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: docs/screenshots/android
          if-no-files-found: error
      - name: Commit changed screenshots
        run: |
          git add docs/screenshots/android
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Android screenshots"
          git push
