name: Release
# Push a tag like v1.0.0 (matching package.json "version") to build installers for
# Windows, macOS and Linux and publish them as a GitHub release. Run it by hand from
# the Actions tab to build the installers without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            dist: npm run dist
          - os: macos-latest
            dist: npm run dist:mac -- --x64 --arm64
          - os: ubuntu-latest
            dist: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | Windows | `UsageMonitor-Setup-*.exe` (installer) or `UsageMonitor-portable-*.exe` (no install) |
            | macOS (Apple silicon / Intel) | `UsageMonitor-*-arm64.dmg` / `UsageMonitor-*-x64.dmg` |
            | Linux | `UsageMonitor-*.AppImage` |

            Builds are unsigned. Windows SmartScreen: **More info → Run anyway**. macOS: right-click the app → **Open** the first time.

            After installing, sign in once to the CLIs you want metered: `claude`, `codex login`, `agy`, `grok`.
