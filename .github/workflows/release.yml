name: Release
# Push a tag like v1.0.0 (matching package.json "version") to build installers for
# Windows, macOS and Linux and publish them as a GitHub release. Or run it by hand
# from the Actions tab: with "publish" ticked it creates the v<version> tag and the
# release from the chosen branch; unticked it only builds the installers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Create the v<package.json version> tag and publish the release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
              exit 1
            fi
            publish=true
          elif [ "$PUBLISH_INPUT" = "true" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "::error::Tag $tag already exists. Bump version in package.json first."
              exit 1
            fi
            publish=true
          else
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release tag $tag, publish: $publish"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            dist: npm run dist
          - os: macos-latest
            dist: npm run dist:mac -- --x64 --arm64
          - os: ubuntu-latest
            dist: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          # latest*.yml and the .blockmap files are what installed copies read to update
          # themselves (electron-updater), so they ship with every release.
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Verify Android even when release signing is unavailable
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Every release must be signed with the same key, or installed copies refuse the update.
        # Without the key in the repository secrets, the release goes out without the phone app.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this release has no Android app. See android/README.md."
            exit 0
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          cd android
          ./gradlew --no-daemon releaseBundle
          ls -la app/build/dist
      - uses: actions/upload-artifact@v7
        with:
          name: installers-android
          if-no-files-found: ignore
          # latest-android.json is what installed copies read to update themselves.
          path: |
            android/app/build/dist/*.apk
            android/app/build/dist/latest-android.json

  release:
    needs: [prepare, build, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: Check update metadata
        run: |
          for f in latest.yml latest-linux.yml latest-mac.yml; do
            test -s "installers/$f" || { echo "::error::$f is missing, installed copies could not update"; exit 1; }
          done
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: repo
      - name: Release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${TAG#v}"
          {
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows | \`UsageMonitor-Setup-*.exe\` (installer, updates itself) or \`UsageMonitor-portable-*.exe\` (no install) |"
            echo "| macOS (Apple silicon / Intel) | \`UsageMonitor-*-arm64.dmg\` / \`UsageMonitor-*-x64.dmg\` |"
            echo "| Linux | \`UsageMonitor-*.AppImage\` (updates itself) |"
            if ls installers/*.apk >/dev/null 2>&1; then
              echo "| Android 10+ | \`UsageMonitor-*.apk\` (updates itself; pairs with the desktop app for the plan meters) |"
            fi
            echo
            if ! ls installers/*.apk >/dev/null 2>&1; then
              echo "This release publishes desktop downloads only. Android changes are available in the source; no APK is attached."
              echo
            fi
            echo "Desktop builds are unsigned. Windows SmartScreen: **More info → Run anyway**. macOS: right-click the app → **Open** the first time."
            echo
            echo "**Updates:** from 1.1.0 on, the Windows installer and the Linux AppImage update themselves (at launch, after the computer wakes and every six hours). The portable exe, zip/tar.gz folders and the macOS app show a notification with a download link. Copies older than 1.1.0 need one manual update. Keep \`latest*.yml\` and \`*.blockmap\` attached to this release: installed copies read them."
            echo
            echo "After installing, sign in once to the CLIs you want metered: \`claude\`, \`codex login\`, \`agy\`, \`grok\`, \`cursor-agent login\`, \`gh auth login\`."
            echo
            # The matching CHANGELOG.md section, if there is one.
            awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1; print "## What changed"; next } /^## / && found { exit } found' repo/CHANGELOG.md
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: notes.md
