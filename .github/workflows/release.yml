name: Release
# Push a tag like v1.0.0 (matching package.json "version") to build installers for
# Windows, macOS and Linux and publish them as a GitHub release. Or run it by hand
# from the Actions tab: with "publish" ticked it creates the v<version> tag and the
# release from the chosen branch; unticked it only builds the installers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Create the v<package.json version> tag and publish the release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $tag"
              exit 1
            fi
            publish=true
          elif [ "$PUBLISH_INPUT" = "true" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "::error::Tag $tag already exists. Bump version in package.json first."
              exit 1
            fi
            publish=true
          else
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release tag $tag, publish: $publish"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            dist: npm run dist
          - os: macos-latest
            dist: npm run dist:mac -- --x64 --arm64
          - os: ubuntu-latest
            dist: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | Windows | `UsageMonitor-Setup-*.exe` (installer) or `UsageMonitor-portable-*.exe` (no install) |
            | macOS (Apple silicon / Intel) | `UsageMonitor-*-arm64.dmg` / `UsageMonitor-*-x64.dmg` |
            | Linux | `UsageMonitor-*.AppImage` |

            Builds are unsigned. Windows SmartScreen: **More info → Run anyway**. macOS: right-click the app → **Open** the first time.

            After installing, sign in once to the CLIs you want metered: `claude`, `codex login`, `agy`, `grok`.
